[profile.default]
fs_permissions = [{ access = "read", path = "../packages/shared/vectors" }]
src = "src"
test = "test"
out = "out"
libs = ["lib", "node_modules"]
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]
via_ir = true
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = true
