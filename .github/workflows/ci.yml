name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 1) any 0x+64-hex outside tests/fixtures/locks and docs/proof (proof holds public tx hashes/ids/calldata)
      # 2) key-labelled 0x+64-hex anywhere outside tests. Prints file:line only, never the value.
      - run: |
          set -o pipefail
          ex=(':!*test*' ':!*fixture*' ':!*vectors*' ':!pnpm-lock.yaml' ':!*package-lock.json')
          # public tx hashes in explorer links (`/tx/0x..` and their `[0x..](..../tx/0x..)` link text) are not secrets
          a=$(git grep -nIE '0x[0-9a-fA-F]{64}' -- . "${ex[@]}" ':!docs/proof' | perl -pe 's{\[0x[0-9a-fA-F]{64}\]\(https://explorer\.testnet\.whitechain\.io/tx/0x[0-9a-fA-F]{64}\)}{}g; s{/tx/0x[0-9a-fA-F]{64}}{}g' | grep -E '0x[0-9a-fA-F]{64}' | cut -d: -f1,2 || true)
          b=$(git grep -nIiE '(priv(ate)?_?key|secret|mnemonic)[^0-9a-zA-Z]{0,6}0x[0-9a-fA-F]{64}' -- . "${ex[@]}" | cut -d: -f1,2 || true)
          hits=$(printf '%s\n%s\n' "$a" "$b" | sed '/^$/d' | sort -u)
          if [ -n "$hits" ]; then echo "possible private keys:"; echo "$hits"; exit 1; fi
          echo "secret-scan: clean"
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'
      - run: npm install --prefix packages/shared --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix packages/ens --ignore-scripts
      - run: npm ci --prefix apps/api --ignore-scripts
      - run: npm test
      - run: npm --prefix apps/api run test:world-fixtures
      - run: npm test --prefix packages/shared
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: npm install --prefix contracts --ignore-scripts --package-lock=false
      - run: forge fmt --root contracts --check
      - run: forge test --root contracts -vvv
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'
      # web imports packages/shared and packages/ens by relative path; they need their own deps
      - run: npm install --prefix packages/shared --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix packages/ens --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: 'web'
      - run: npm run lint
        working-directory: 'web'
      - run: npm run build
        working-directory: 'web'

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'
      - run: npm install --prefix packages/shared --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix packages/ens --ignore-scripts
      - run: npm ci --prefix web --ignore-scripts
      - run: npm install --prefix web/e2e --ignore-scripts
      - run: npx playwright install --with-deps chromium
        working-directory: web/e2e
      - run: npm --prefix web run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: web/e2e/playwright-report
