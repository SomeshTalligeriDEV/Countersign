<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pie Lite</title>
<style>
  :root { --bg:#faf8f4; --fg:#1d1b18; --muted:#6b665e; --card:#fff; --line:#e6e1d8; --accent:#c2410c; --ok:#15803d; --bad:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151412; --fg:#f1ede6; --muted:#a39d93; --card:#1f1d1a; --line:#34312c; --accent:#fb923c; --ok:#4ade80; --bad:#f87171; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:28px; margin:0; } .sub { color:var(--muted); margin:4px 0 20px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #mic { width:120px; height:120px; border-radius:50%; border:0; background:var(--accent); color:#fff; font-size:44px; cursor:pointer; display:block; margin:16px auto; }
  #mic.on { box-shadow:0 0 0 10px color-mix(in srgb, var(--accent) 30%, transparent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin:12px 0; white-space:pre-wrap; }
  .you { color:var(--muted); } .quote { border-color:var(--accent); }
  .code { font-family:ui-monospace, monospace; border-color:var(--ok); }
  .warn { border-color:var(--bad); }
  button.s { border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:8px; padding:8px 12px; cursor:pointer; font:inherit; }
  button.ok { background:var(--ok); color:#fff; border:0; } button.no { background:var(--bad); color:#fff; border:0; }
  select, input { font:inherit; padding:6px 8px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  input#text { flex:1; min-width:0; }
  .small { font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Pie Lite</h1>
  <p class="sub">Say what you want. Pays privately from your shielded Zcash balance. Hackathon demo: testnet and test purchases only.</p>

  <div class="row">
    <label>Language <select id="lang"><option value="hi-IN">Hindi / Hinglish</option><option value="en-IN">English (India)</option></select></label>
    <button class="s" id="dep">Top up</button>
    <button class="s" id="bal">Balance</button>
    <button class="s" id="ord">Orders</button>
  </div>

  <button id="mic" title="Tap and speak">🎙</button>
  <div class="row"><input id="text" placeholder="…or type: Rs 500 Swiggy card"><button class="s" id="send">Send</button></div>
  <p class="small">Say "haan" / "yes" to confirm a quote, "nahi" / "cancel" to stop. Voucher codes are shown on screen, never read aloud.</p>

  <div id="log"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const log = $("log");
let pending = false, listening = false;

function add(text, cls = "") {
  const d = document.createElement("div");
  d.className = "card " + cls; d.textContent = text; log.prepend(d); return d;
}
function say(text) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/Rs /g, "rupees "));
    u.lang = $("lang").value; speechSynthesis.speak(u);
  } catch (e) {}
}
async function call(path, body = {}) {
  const r = await fetch("/pie/" + path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  return r.json();
}
function showPurchase(p) {
  if (!p) return;
  const msgs = {
    duplicate: "You just bought exactly this, so I stopped to avoid paying twice.",
    insufficient: "Not enough balance. Tap Top up.",
    failed: "The purchase didn't go through. Your balance was refunded.",
    no_pending_quote: "There's nothing to confirm.",
  };
  if (p.status === "ok") {
    if (p.gift_link) { add(`Gift for ${p.gift_to} ready. Send this link on WhatsApp:\n${p.gift_link}`, "code"); say(`Gift for ${p.gift_to} is ready. Send them the link on screen.`); }
    else { add(`${p.product}\n${(p.codes || []).join("\n")}`, "code"); say("Done. Your voucher is on the screen. I won't read it aloud."); }
    add(`Receipt: ${p.product} x${p.quantity}, paid Rs ${Math.round(p.total_inr)} from your shielded balance.\nBitrefill invoice ${p.invoice_id} · ${p.time} · balance left Rs ${p.balance_inr}`);
  } else if (p.status === "denied") { add("Not buying: " + p.reason, "warn"); say("Not buying. " + p.reason); }
  else if (p.status === "cooling") { add(`Safety pause for ${p.minutes_left} min. ${p.say || ""}`, "warn"); say("This order waits a few minutes for safety."); }
  else { add(msgs[p.status] || JSON.stringify(p), "warn"); say(msgs[p.status] || "Something went wrong."); }
}
async function handle(text) {
  text = text.trim(); if (!text) return;
  add("You: " + text, "you");
  const t = text.toLowerCase();
  if (pending && /\b(haan|han|ha|yes|confirm|kar do|ok)\b/.test(t)) { pending = false; showPurchase(await call("confirm")); return; }
  if (pending && /\b(nahi|nahin|no|cancel|ruko|mat)\b/.test(t)) { pending = false; await call("cancel"); add("Cancelled. Nothing was charged."); say("Cancelled."); return; }
  const r = await call("chat", { text });
  if (r.error) { add(r.error, "warn"); return; }
  add(r.reply, r.blocked ? "warn" : ""); say(r.reply);
  if (r.quote) {
    if (r.quote.decision === "ask") {
      pending = true;
      const box = add(r.quote.card, "quote");
      const row = document.createElement("div"); row.className = "row";
      const yes = Object.assign(document.createElement("button"), { className: "s ok", textContent: "Confirm" });
      const no = Object.assign(document.createElement("button"), { className: "s no", textContent: "Cancel" });
      yes.onclick = async () => { pending = false; row.remove(); showPurchase(await call("confirm")); };
      no.onclick = async () => { pending = false; row.remove(); await call("cancel"); add("Cancelled. Nothing was charged."); };
      row.append(yes, no); box.append(document.createElement("br"), row);
      setTimeout(() => say(r.quote.card.replace("Please check before you confirm:", "Here's the quote.") + " Say haan to confirm."), 400);
    } else if (r.quote.decision === "deny") { add("Not buying: " + r.quote.reason, "warn"); }
    else if (r.quote.decision === "auto") { add("Auto-approved: " + r.quote.reason); showPurchase(r.purchase); }
  }
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (SR) {
  rec = new SR(); rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onresult = (e) => handle(e.results[0][0].transcript);
  rec.onend = () => { listening = false; $("mic").classList.remove("on"); };
  rec.onerror = (e) => add("Mic error: " + e.error, "warn");
}
$("mic").onclick = () => {
  if (!rec) { add("Voice needs Chrome or Edge. You can type instead.", "warn"); return; }
  if (listening) { rec.stop(); return; }
  rec.lang = $("lang").value; listening = true; $("mic").classList.add("on"); rec.start();
};
$("send").onclick = () => { handle($("text").value); $("text").value = ""; };
$("text").onkeydown = (e) => { if (e.key === "Enter") $("send").click(); };
$("dep").onclick = async () => { const d = await call("deposit"); add(`Top up: send shielded testnet ZEC to\n${d.address}\nMemo: ${d.memo}\n\nOne-tap link:\n${d.zcash_uri}`); };
$("bal").onclick = async () => { const b = await call("balance"); add(`Balance: Rs ${b.balance_inr}`); say(`Your balance is rupees ${b.balance_inr}`); };
$("ord").onclick = async () => { const o = await call("orders"); add(o.orders && o.orders.length ? o.orders.map(x => `${x.product} (${x.time}): ${x.status}\ninvoice ${x.invoice_id}`).join("\n\n") : "No orders yet."); };
</script>
</body>
</html>
